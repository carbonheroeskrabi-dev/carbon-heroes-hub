<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carbon Heroes Hub | โรงไฟฟ้ากระบี่ กฟผ.</title>
<meta name="description" content="Carbon Heroes Hub - ธนาคารขยะดิจิทัล คาร์บอนเครดิต และศูนย์กลางความยั่งยืนของโรงไฟฟ้ากระบี่">
<meta name="theme-color" content="#0D3D2E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<!-- Chart.js โหลดแบบ on-demand ผ่าน ensureChartLib() ใน app.js เพื่อกัน race condition -->
</head>
<body>

<div id="app">
  <!-- Desktop side rail -->
  <nav class="rail" id="rail"></nav>

  <main>
    <div class="topbar">
      <div class="titles">
        <h1>⚡ Carbon Heroes Hub</h1>
        <p>โรงไฟฟ้ากระบี่ · การไฟฟ้าฝ่ายผลิตแห่งประเทศไทย (กฟผ.)</p>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div id="syncStatus" class="pill" style="cursor:pointer" title="คลิกเพื่อเปลี่ยน URL การเชื่อมต่อ">กำลังเชื่อมต่อ Google Sheet...</div>
        <button class="install-btn" id="installBtn" hidden>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v14m0 0l-5-5m5 5l5-5M4 21h16"/></svg>
          ติดตั้งแอป
        </button>
      </div>
    </div>

    <svg class="volt-divider" viewBox="0 0 800 14" preserveAspectRatio="none">
      <polyline points="0,7 120,7 140,1 160,13 180,1 200,13 220,7 800,7" fill="none" stroke="#F5C542" stroke-width="2"/>
    </svg>

    <div id="loadingState" class="empty-state">⏳ กำลังดึงข้อมูลจาก Google Sheet ครั้งแรก...</div>

    <section class="view" id="view-dashboard"></section>
    <section class="view" id="view-bank"></section>
    <section class="view" id="view-carbon"></section>
    <section class="view" id="view-leaderboard"></section>
    <section class="view" id="view-learn"></section>
    <section class="view" id="view-market"></section>
    <section class="view" id="view-sroi"></section>
    <section class="view" id="view-esg"></section>

    <footer class="app-footer">
      <span>Carbon Heroes Hub v1.0 · ข้อมูลจากบัญชีธนาคารขยะโรงไฟฟ้ากระบี่</span>
      <span>ต้นแบบสำหรับขยายผลสู่ระบบใช้งานจริงของ กฟผ.</span>
    </footer>
  </main>

  <nav class="mobile-nav" id="railMobile"></nav>
</div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
